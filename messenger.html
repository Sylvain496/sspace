<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090b18"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="./messenger.webmanifest"><title>SSPACE Messenger</title><style>*{box-sizing:border-box}body{margin:0;background:#090b18;color:#f5f6ff;font:16px system-ui;height:100dvh;display:flex;flex-direction:column}.head{padding:14px 16px;background:#101528;border-bottom:1px solid #2a3151;display:flex;align-items:center;justify-content:space-between}.brand{font-size:20px;font-weight:800;color:#ffb42d}.head small{display:block;color:#aab3d0;font-size:12px}button{background:#ffb42d;color:#16121a;border:0;padding:10px 13px;border-radius:12px;font-weight:800}iframe{border:0;width:100%;flex:1;background:#090b18}.install{display:none}</style></head><body><header class="head"><div><div class="brand">SSPACE Messenger</div><small>Messages, appels et conversations</small></div><button id="install" class="install">Installer</button><button onclick="location.href='./index.html'">Retour SSPACE</button></header><iframe id="messengerFrame" title="SSPACE Messenger" src="./index.html?openMessenger=1"></iframe><script>let deferredInstall;const b=document.getElementById('install');window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;b.style.display='block'});b.onclick=async()=>{if(!deferredInstall)return;await deferredInstall.prompt();deferredInstall=null;b.style.display='none'};window.addEventListener('appinstalled',()=>b.style.display='none');</script></body></html>
