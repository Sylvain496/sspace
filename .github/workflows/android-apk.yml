name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'index.html'
      - 'assets/**'
      - 'supabase/migrations/**'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore and commit approved SSPACE intro artwork
        uses: actions/download-artifact@v4
        with:
          name: SSPACE-Deployment-Bundle
          repository: ${{ github.repository }}
          run-id: 43656372986
          github-token: ${{ github.token }}
          path: /tmp/sspace-artwork
      - name: Integrate intro artwork into Web and Android
        run: |
          mkdir -p /tmp/sspace-bundle assets android/app/src/main/assets/assets
          unzip -o /tmp/sspace-artwork/SSPACE-deploiement.zip -d /tmp/sspace-bundle
          cp /tmp/sspace-bundle/index.html index.html
          cp /tmp/sspace-bundle/assets/sspace-intro.png assets/sspace-intro.png
          cp index.html android/app/src/main/assets/index.html
          cp assets/sspace-intro.png android/app/src/main/assets/assets/sspace-intro.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/sspace-intro.png android/app/src/main/assets/index.html android/app/src/main/assets/assets/sspace-intro.png
          if ! git diff --cached --quiet; then
            git commit -m "Add original animated SSPACE intro artwork"
            git push
          fi
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle --no-daemon -p android assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SSPACE-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Package deployable source
        run: zip -r SSPACE-deploiement.zip index.html manifest.webmanifest sw.js README.md DEPLOYMENT.md supabase android -x 'android/app/build/*'
      - name: Upload deployment bundle
        uses: actions/upload-artifact@v4
        with:
          name: SSPACE-Deployment-Bundle
          path: SSPACE-deploiement.zip
          if-no-files-found: error
